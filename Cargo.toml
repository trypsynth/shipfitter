[package]
name = "shipfitter"
version = "0.2.2"
description = "Build and packaging helpers for Rust desktop apps: docs, installers, app bundles and archives"
readme = "README.md"
repository = "https://github.com/trypsynth/shipfitter"
keywords = ["build", "packaging", "installer", "dmg", "release"]
categories = ["development-tools::build-utils"]
license = "MIT"
edition = "2024"

[features]
default = []
# Markdown documentation as standalone HTML pages, for a build script or an xtask.
docs = ["dep:finl_unicode", "dep:pulldown-cmark"]
# Release builds, zip and tar.gz archives, AppImages and Inno Setup installers, for an xtask.
# Downloads the tools they need that aren't installed.
package = ["dep:flate2", "dep:minisign", "dep:serde_json", "dep:sha2", "dep:tar", "dep:ureq", "dep:walkdir", "dep:zip"]
# The Windows application manifest and version resource, for a build script.
windows-resources = ["dep:embed-manifest", "dep:winres"]

[dependencies]
embed-manifest = { version = "1.5.1", optional = true }
finl_unicode = { version = "1.5.0", default-features = false, features = ["categories"], optional = true }
flate2 = { version = "1.1.10", optional = true }
minisign = { version = "0.10.0", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"], optional = true }
serde_json = { version = "1.0.151", optional = true }
sha2 = { version = "0.11.0", optional = true }
tar = { version = "0.4.46", optional = true }
ureq = { version = "3.4.2", optional = true }
walkdir = { version = "2.5.0", optional = true }
winres = { version = "0.1.12", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
minisign-verify = "0.2.5"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Everything here fails the same way: an I/O error, or the tool it runs failing.
missing_errors_doc = "allow"
